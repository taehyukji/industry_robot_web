<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="기계팔 성능 입력값을 바탕으로 공장 효율, 경제성, 종합 점수를 평가하는 웹 시뮬레이션입니다.">
    <meta name="theme-color" content="#0f8b8d">
    <meta property="og:title" content="기계팔 공장 평가">
    <meta property="og:description" content="기계팔 성능을 입력하고 공장 평가 점수를 그래프로 확인하세요.">
    <meta property="og:type" content="website">
    <title>기계팔 공장 평가</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" id="inputScreen">
        <div class="visual-zone">
          <div class="status-rail">
            <span>Robot Arm</span>
            <strong id="liveTotal">100.00</strong>
          </div>

          <svg class="robot-arm robot-silhouette" viewBox="0 0 620 520" role="img" aria-label="검은색 기계팔 일러스트">
            <path class="silhouette-shadow" d="M92 437 C185 399 441 399 529 437 C446 462 181 462 92 437 Z"></path>
            <g class="silhouette">
              <path d="M205 397 L410 397 L440 462 L175 462 Z"></path>
              <rect x="236" y="348" width="136" height="54" rx="12"></rect>
              <circle cx="304" cy="348" r="62"></circle>
              <circle cx="304" cy="348" r="30" class="cutout"></circle>

              <path d="M262 326 C239 319 226 294 235 271 L292 127 C301 104 327 93 350 102 C373 111 385 137 376 160 L319 304 C310 327 285 335 262 326 Z"></path>
              <circle cx="334" cy="132" r="48"></circle>
              <circle cx="334" cy="132" r="21" class="cutout"></circle>

              <path d="M359 104 C348 83 356 57 377 46 L495 -17 C516 -28 542 -20 553 1 C564 22 556 48 535 59 L417 122 C396 133 370 125 359 104 Z"></path>
              <circle cx="510" cy="31" r="39"></circle>
              <circle cx="510" cy="31" r="17" class="cutout"></circle>

              <rect x="490" y="53" width="92" height="34" rx="12" transform="rotate(28 536 70)"></rect>
              <path d="M561 79 C578 73 597 77 609 90 L589 113 C582 106 572 104 563 108 Z"></path>
              <path d="M545 99 C551 116 547 135 534 147 L511 127 C518 120 520 110 516 101 Z"></path>
            </g>
          </svg>
        </div>

        <form class="control-zone" id="robotForm">
          <div class="topbar">
            <div>
              <p class="eyebrow">Factory Robot Evaluation</p>
              <h1>기계팔 성능 입력</h1>
            </div>
            <button class="ghost-button" type="button" id="resetButton">기준값</button>
          </div>

          <div class="input-grid">
            <label class="field">
              <span>작업 속도 <b>사이클/분</b></span>
              <input type="range" min="20" max="120" step="1" value="60" data-sync="speed">
              <input type="number" min="20" max="120" step="1" value="60" id="speed">
            </label>

            <label class="field">
              <span>반복정밀도 <b>mm</b></span>
              <input type="range" min="0.01" max="0.30" step="0.01" value="0.10" data-sync="precision">
              <input type="number" min="0.01" max="0.30" step="0.01" value="0.10" id="precision">
            </label>

            <label class="field">
              <span>가반하중 <b>kg</b></span>
              <input type="range" min="0.5" max="30" step="0.5" value="10" data-sync="payload">
              <input type="number" min="0.5" max="30" step="0.5" value="10" id="payload">
            </label>

            <label class="field">
              <span>고장률 <b>0~1</b></span>
              <input type="range" min="0" max="0.30" step="0.01" value="0.03" data-sync="failureRate">
              <input type="number" min="0" max="0.30" step="0.01" value="0.03" id="failureRate">
            </label>

            <label class="field">
              <span>유지보수 시간 <b>hour/day</b></span>
              <input type="range" min="0" max="8" step="0.5" value="1" data-sync="maintenanceTime">
              <input type="number" min="0" max="8" step="0.5" value="1" id="maintenanceTime">
            </label>

            <label class="field">
              <span>에너지 소비량 <b>kWh/day</b></span>
              <input type="range" min="20" max="300" step="5" value="100" data-sync="energyPerDay">
              <input type="number" min="20" max="300" step="5" value="100" id="energyPerDay">
            </label>

            <label class="field wide">
              <span>하루 환산 설비비 <b>원/day</b></span>
              <input type="range" min="50000" max="500000" step="10000" value="150000" data-sync="investmentPerDay">
              <input type="number" min="50000" max="500000" step="10000" value="150000" id="investmentPerDay">
            </label>
          </div>

          <button class="primary-button" type="submit">평가 결과 보기</button>
        </form>
      </section>

      <section class="result-screen hidden" id="resultScreen">
        <div class="result-header">
          <button class="ghost-button" type="button" id="backButton">입력 수정</button>
          <div>
            <p class="eyebrow">Evaluation Result</p>
            <h2>공장 평가 결과</h2>
          </div>
        </div>

        <div class="score-summary">
          <div class="total-score">
            <span>종합 점수</span>
            <strong id="totalScore">100.00</strong>
            <p id="scoreMessage">기준 공장 수준</p>
          </div>
          <div class="metric-strip">
            <div>
              <span>수요 충족률</span>
              <strong id="serviceLevel">0%</strong>
            </div>
            <div>
              <span>양품률</span>
              <strong id="yieldRate">0%</strong>
            </div>
            <div>
              <span>총이익</span>
              <strong id="totalProfit">0원</strong>
            </div>
          </div>
        </div>

        <div class="result-layout">
          <div class="chart-panel">
            <div class="chart-topline">
              <h3>점수 그래프</h3>
              <span>기준값 100</span>
            </div>
            <div class="bar-chart" id="barChart" aria-label="평가 점수 막대그래프"></div>
          </div>

          <div class="detail-list">
            <h3>세부 성능</h3>
            <dl>
              <div>
                <dt>보정 생산능력</dt>
                <dd id="adjustedProcessRate">0</dd>
              </div>
              <div>
                <dt>보정 불량률</dt>
                <dd id="adjustedDefectRate">0</dd>
              </div>
              <div>
                <dt>보정 가동률</dt>
                <dd id="adjustedUptime">0</dd>
              </div>
              <div>
                <dt>단위당 이익</dt>
                <dd id="unitProfit">0</dd>
              </div>
            </dl>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
